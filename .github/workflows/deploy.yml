name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys the static export to Cloudflare Pages.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN    - token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   - your Cloudflare account id
#
# Create the Pages project once (name must match --project-name below):
#   npx wrangler pages project create think-like-programmer --production-branch main
#
# Alternatively, connect the repo directly in the Cloudflare Pages dashboard
# (build command: `npm run build`, output directory: `out`) and delete this file.

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://thinklikeprogrammer.dev

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=think-like-programmer --branch=main
