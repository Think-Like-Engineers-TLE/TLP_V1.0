name: Deploy

on:
  workflow_dispatch:

# Manual-only for now (no push trigger) — deploys are done by hand via
# `wrangler pages deploy` (see docs/architecture.md). Flip this back to
# `push: branches: [main]` if/when auto-deploy on merge is wanted.
#
# Deploys the static export to Cloudflare Pages.
#
# Required repository secrets (not yet set — this workflow will fail without them):
#   CLOUDFLARE_API_TOKEN    - token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID   - the "Aeroer Mak" account id (b26fb248d2c7538a86f475426af32828)
#
# The Pages project already exists (created 2026-08-27):
#   https://think-like-programmer.pages.dev
#
# Alternatively, connect the repo directly in the Cloudflare Pages dashboard
# (build command: `npm run build`, output directory: `out`) and delete this file.

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Update to the custom domain once one is attached to the Pages project.
          NEXT_PUBLIC_SITE_URL: https://think-like-programmer.pages.dev

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=think-like-programmer --branch=main
