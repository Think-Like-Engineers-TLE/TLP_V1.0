name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate book metadata
        run: npm run validate:books

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://thinklikeprogrammer.dev

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: out/
          retention-days: 7
